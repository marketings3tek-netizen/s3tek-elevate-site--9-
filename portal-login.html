<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal Login | S3tek Elevate</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal-legacy.css">
<style>
  body{background:var(--foot);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .login-card{background:#fff;color:var(--ink);border-radius:24px;padding:44px;width:100%;max-width:400px;box-shadow:0 30px 60px rgba(0,0,0,.4)}
  .login-card .nav__brand{margin-bottom:22px}
  .login-card input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;margin-top:6px;margin-bottom:18px}
  .login-card label{font-size:13px;font-weight:600}
  .login-err{font-size:13px;color:#dc2626;min-height:18px;margin-top:4px}
</style>
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>
<div class="login-card">
  <div class="nav__brand"><img src="images/logo.png" alt="" class="nav__logo-img"><span class="nav__mark">S3TEK <span>ELEVATE</span></span></div>
  <h1 style="font-family:var(--font-display);font-size:22px;margin-bottom:6px">Client Portal</h1>
  <p style="color:var(--muted);font-size:14px;margin-bottom:24px">Enter the access code we shared with you.</p>
  <form id="portal-login-form">
    <label>Business name</label>
    <input type="text" id="p-business" required placeholder="Acme Corp">
    <label>Access code</label>
    <input type="password" id="p-code" required placeholder="••••••••">
    <p class="login-err" id="p-err"></p>
    <button type="submit" class="btn btn--solid" style="width:100%">Enter Portal →</button>
  </form>
  <p style="font-size:11.5px;color:var(--muted);margin-top:18px">Don't have a code? <a href="contact.html" style="color:var(--accent)">Contact us</a>.</p>
</div>
<script>
// DEMO ACCESS GATE — not real authentication.
// This just checks the code client-side, which anyone can read in view-source.
// It's fine for keeping casual visitors out of a client's dashboard view,
// but do not use it to protect anything genuinely sensitive without a real
// backend login (see PORTAL_SETUP.md).
const CLIENTS = {
  "DEMO2026": "Demo Client"
  // EDIT: add one entry per client, e.g. "TF2026": "Tribe Fortis"
};
document.getElementById('portal-login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const biz = document.getElementById('p-business').value.trim();
  const code = document.getElementById('p-code').value.trim().toUpperCase();
  const err = document.getElementById('p-err');
  if (CLIENTS[code]) {
    sessionStorage.setItem('s3tek_client', CLIENTS[code]);
    sessionStorage.setItem('s3tek_client_biz', biz);
    window.location.href = 'portal.html';
  } else {
    err.textContent = "That code doesn't match — check with your strategist.";
  }
});
</script>
<script src="portal-legacy.js"></script>
</body>
</html>
